name: webmcp_flutter_generator
description: Generates live-instance WebMCP tool sources for explicitly annotated methods.
version: 0.1.0
repository: https://github.com/ortal83cohen/flutter_webmcp

environment:
  sdk: ^3.13.0

dependencies:
  analyzer: ^13.3.0
  build: ^4.0.0
  build_config: ^1.3.0
  source_gen: 4.2.4
  webmcp_flutter_annotations: ^0.1.0

dev_dependencies:
  build_runner: ^2.16.0
  build_test: ^3.0.0
  test: ^1.31.0
  webmcp_flutter:
    path: ../..

dependency_overrides:
  webmcp_flutter_annotations:
    path: ../webmcp_flutter_annotations
